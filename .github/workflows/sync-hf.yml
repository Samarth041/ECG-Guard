name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main
      - ecg-guard-v2
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Check Hugging Face secrets
        id: check_secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN or HF_SPACE_ID secret is not set. Skipping Hugging Face Spaces sync."
            echo "To enable auto-deploy to Hugging Face Spaces, add HF_TOKEN and HF_SPACE_ID in Settings -> Secrets and variables -> Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        if: steps.check_secrets.outputs.configured == 'true'
        run: pip install --no-cache-dir huggingface_hub

      - name: Sync repository to Hugging Face Space
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          python - << 'EOF'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE_ID"]

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8") if readme_path.exists() else ""
          if not readme.startswith("---"):
              frontmatter = (
                  "---\n"
                  "title: ECG-Guard\n"
                  "emoji: 💓\n"
                  "colorFrom: teal\n"
                  "colorTo: blue\n"
                  "sdk: docker\n"
                  "app_port: 7860\n"
                  "pinned: false\n"
                  "---\n\n"
              )
              readme_path.write_text(frontmatter + readme, encoding="utf-8")

          api = HfApi(token=token)
          api.upload_folder(
              folder_path=".",
              repo_id=space_id,
              repo_type="space",
              ignore_patterns=[
                  ".git/**",
                  ".github/**",
                  "*.ipynb",
                  "tests/**",
                  "frontend/node_modules/**",
                  "frontend/dist/**",
                  "**/__pycache__/**",
              ],
              delete_patterns=["*"],
              commit_message="Auto-deploy from GitHub Actions",
          )
          print(f"Deployed successfully to https://huggingface.co/spaces/{space_id}")
          EOF
